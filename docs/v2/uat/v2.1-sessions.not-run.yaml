schema_version: 1
kind: v2.1-uat-session-registry
plan_id: v2.1-mandatory-uat
execution_state: NOT_RUN
purpose: Registro inicial completo de las 16 sesiones obligatorias. No representa
  ejecuciones ni evidencia; cada registro debe sustituirse por una sesión ejecutada
  con un ID de sesión y manifiesto iguales.
session_contract:
  one_scenario_per_session: true
  manifest_id_must_equal_session_id: true
  evidence_path_prefix: artifacts/uat/v2.1/sessions/<session-id>/evidence/
  required_evidence_ref_fields:
  - manifest_id
  - session_id
  - path
  - media_type
  - sha256
  - source_kind
  - source_run_id
  - source_path
  - source_sha256
  source_provenance: 'Ejecutadas: source_runner_run_id es obligatorio si hay referencias
    runner; cada fuente debe estar declarada en provenance.allowed_sources y cada
    evidencia debe enlazar source_path y source_sha256 de esa fuente.'
sessions:
- scenario_id: UAT2-001
  feature_id: F-01
  requirement_ref: UAT2-001
  execution_state: EXECUTED
  verdict: PASS
  session_id: UAT2-001
  manifest_id: UAT2-001
  evidence_refs:
