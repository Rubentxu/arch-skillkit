        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/relations.json
        type: application/json; high-confidence automatic relations
      - source_path: runs/<run-id>/uat2-005/provenance-check.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/provenance-check.json
