schema_version: 1
plan_id: v2.1-mandatory-uat
initiative: V2.1
execution_state: NOT_RUN
purpose: >-
  Definir el gate UAT V2.1 sin declarar resultados. Un escenario sólo cuenta
  como cubierto cuando una sesión con el mismo scenario_id tiene un verdict
  admisible y cada evidencia requerida está registrada por hash en el
  manifiesto inmutable.
evidence_root: artifacts/uat/v2.1
session_registry: v2.1-sessions.not-run.yaml
evidence_contract:
  session_boundary: >-
    Cada sesión cubre exactamente un scenario_id y tiene un manifiesto propio:
    manifest_id debe ser idéntico a session_id. Una entrada sólo es admisible
    si declara ese session_id y su path comienza por
    artifacts/uat/v2.1/sessions/<session-id>/evidence/.
  required_ref_fields: [manifest_id, session_id, path, media_type, sha256, source_kind, source_run_id, source_path, source_sha256]
  hash_algorithm: sha256
  expected_evidence_fields: [source_path, evidence_ref_path, type]
  canonical_source_kind_by_evidence_path_prefix:
    artifacts/uat/v2.1/sessions/<session-id>/evidence/runner/: runner
    artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/: v2-orchestrator
    artifacts/uat/v2.1/sessions/<session-id>/evidence/benchmark/: benchmark-harness
  cross_run_rule: >-
    No se permiten referencias a otro session_id, manifest_id, ni directorio
    de sesión. `source_path` identifica el artefacto del productor;
    `evidence_ref_path` identifica exclusivamente su copia canónica dentro de
    la sesión y es la ruta que se evalúa para cobertura. Toda evidencia
    importada conserva source_kind, source_run_id, source_path y source_sha256.
  provenance_rule: >-
    Una sesión que importe evidencia del runner debe declarar un único
    source_runner_run_id y una entrada runner equivalente en allowed_sources.
    Cada evidence_ref con source_kind=runner debe usar exactamente ese
    source_run_id, una source_path bajo su source_path_prefix y el
    source_sha256 del archivo de origen, igual al sha256 de la copia canónica.
    Las fuentes no runner requieren su propia entrada en allowed_sources; no
    se admiten fuentes implícitas ni mezclas no declaradas.
runner_integration:
  existing_runner: scripts/uat/uat.sh
  applicable_to: [UAT2-001, UAT2-009, UAT2-010]
  output_contract:
    - runs/<run-id>/result.json
    - runs/<run-id>/evidence/checkout-before.json
    - runs/<run-id>/evidence/checkout-after.json
    - runs/<run-id>/payloads/{scan,ingest,review-drift,project,validation,report}.json
    - runs/<run-id>/payloads/replay.txt
  export_handoff: >-
    Tras una ejecución, copiar el árbol exacto desde
    $UAT_STATE_BASE/runs/<runner-run-id>/ a
    artifacts/uat/v2.1/runner-imports/<runner-run-id>/ con cp -a. Para cada
    escenario, copiar únicamente los archivos seleccionados desde esa
    importación a artifacts/uat/v2.1/sessions/<session-id>/evidence/runner/;
    crear un manifiesto cuyo manifest_id sea el session_id y registrar allí
    los SHA-256 de las copias. El run_id de origen se conserva en
    source_runner_run_id y no sustituye al session_id.
  limitation: >-
    El runner inspecciona un repositorio objetivo y no orquesta el dominio
    ActiveGraph V2. Los escenarios marcados v2-orchestrator requieren un
    ejecutor específico que produzca los artefactos indicados.
features:
  - id: F-01
    name: Repository and project-store safety
    requirements: [UAT2-001, UAT2-002, UAT2-003, UAT2-018]
  - id: F-02
    name: Event-sourced architecture and evidence promotion
    requirements: [UAT2-004, UAT2-005, UAT2-006]
  - id: F-03
    name: Bounded context compilation
    requirements: [UAT2-007, UAT2-008, UAT2-017]
  - id: F-04
    name: Regenerable projections and deterministic drift
    requirements: [UAT2-009, UAT2-010, UAT2-011]
  - id: F-05
    name: Governed architecture proposals
    requirements: [UAT2-012, UAT2-013, UAT2-014]
scenarios:
  - scenario_id: UAT2-001
    feature_id: F-01
    requirement_ref: UAT2-001
    title: Repository remains read-only during analysis
    orchestration: existing-runner
    execution_state: NOT_RUN
    expected_evidence:
      - source_path: runs/<run-id>/evidence/checkout-before.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/runner/checkout-before.json
        type: application/json; git-state snapshot
      - source_path: runs/<run-id>/evidence/checkout-after.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/runner/checkout-after.json
        type: application/json; git-state snapshot
      - source_path: runs/<run-id>/result.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/runner/result.json
        type: application/json; repository_unchanged=true
  - scenario_id: UAT2-002
    feature_id: F-01
    requirement_ref: UAT2-002
    title: Each project owns separate Code Index and Architecture World stores
    orchestration: v2-orchestrator
    execution_state: NOT_RUN
    expected_evidence:
      - source_path: runs/<run-id>/uat2-002/store-layout.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/store-layout.json
        type: application/json; project-id to absolute-store-path mapping
      - source_path: runs/<run-id>/uat2-002/assertion.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/assertion.json
        type: application/json; distinct paths assertion
  - scenario_id: UAT2-003
    feature_id: F-01
    requirement_ref: UAT2-003
    title: Code Index can be recreated without losing Architecture World
    orchestration: v2-orchestrator
    execution_state: NOT_RUN
    expected_evidence:
      - source_path: runs/<run-id>/uat2-003/world-before.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/world-before.json
        type: application/json; replayable-world digest
      - source_path: runs/<run-id>/uat2-003/index-recreated.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/index-recreated.json
        type: application/json; recreate operation result
      - source_path: runs/<run-id>/uat2-003/world-after.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/world-after.json
        type: application/json; replayable-world digest equal to before
  - scenario_id: UAT2-004
    feature_id: F-02
    requirement_ref: UAT2-004
    title: EventStore replay reproduces current state
    orchestration: v2-orchestrator
    execution_state: NOT_RUN
    expected_evidence:
      - source_path: runs/<run-id>/uat2-004/event-log.jsonl
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/event-log.jsonl
        type: application/x-ndjson; immutable event log
      - source_path: runs/<run-id>/uat2-004/replay-comparison.json
        evidence_ref_path: artifacts/uat/v2.1/sessions/<session-id>/evidence/orchestrator/replay-comparison.json
        type: application/json; current and replay state digests
  - scenario_id: UAT2-005
    feature_id: F-02
    requirement_ref: UAT2-005
    title: Automatic high-confidence relations retain evidence provenance
    orchestration: v2-orchestrator
    execution_state: NOT_RUN
    expected_evidence:
