non_mandatory_gaps:
  - scenario_id: UAT2-015
    title: Replay requires no new LLM calls
    status: GAP_NOT_MANDATORY
    reason: Included in the catalog but excluded from the V2.1 mandatory gate.
  - scenario_id: UAT2-016
    title: Multi-agent detected layer is identical and inferred divergence visible
    status: GAP_NOT_MANDATORY
    reason: Included in the catalog but excluded from the V2.1 mandatory gate.
coverage_rules:
  admissible_verdicts: [PASS]
  non_covering_verdicts: [NOT_RUN, BLOCKED, FAIL, INCONCLUSIVE]
  scenario_coverage: >-
    PASS session for a planned scenario plus hashes for every declared
    expected_evidence.evidence_ref_path in the immutable manifest. Las rutas
    de origen sólo verifican procedencia; no sustituyen a la copia canónica.
    Missing, mismatched, orphan, or provenance-invalid evidence is NOT COVERED.
  formulas:
    scenario_covered: >-
      1 si y sólo si existe exactamente una sesión PASS del scenario_id, su
      manifest_id coincide con session_id, y todos los expected_evidence del
      escenario tienen una evidence_ref con path igual a su
      expected_evidence.evidence_ref_path, source_path, media_type y SHA-256
      coincidentes en ese manifiesto, su source_kind coincide con el prefijo
      canónico declarado, y pasan las reglas de procedencia; en otro caso 0.
    requirement_coverage: >-
      Un requirement_ref está cubierto cuando su único escenario obligatorio
      está cubierto. requirement_coverage_pct = 100 * requirements_cubiertos
      / requirements_obligatorios.
    feature_coverage: >-
      feature_coverage_pct = 100 * escenarios_cubiertos_de_la_feature /
      escenarios_obligatorios_de_la_feature.
    overall_coverage: >-
      coverage_pct = 100 * escenarios_obligatorios_cubiertos / 16. No incluye
      UAT2-015 ni UAT2-016.
