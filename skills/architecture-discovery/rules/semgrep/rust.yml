# Actix/reqwest architecture markers (high confidence: explicit attribute
# macros and reqwest constructor/helper calls). M2.2 — docs/07 Fase 2.
#
# Known limitations: only async handlers with a return type; injected
# reqwest clients (passed as parameters) are not detected, only explicit
# construction sites.
rules:
  - id: actix.endpoint
    languages: [rust]
    severity: INFO
    message: HTTP endpoint declared with an actix-web attribute macro
    metadata:
      archskillkit:
        fact: exposes
        target_kind: endpoint
        cardinality: many
        confidence: high
    pattern-either:
      - pattern: |
          #[get($PATH)]
          async fn $F(...) -> $T {
            ...
          }
      - pattern: |
          #[post($PATH)]
          async fn $F(...) -> $T {
            ...
          }
      - pattern: |
          #[put($PATH)]
          async fn $F(...) -> $T {
            ...
          }
      - pattern: |
          #[delete($PATH)]
          async fn $F(...) -> $T {
            ...
          }

  - id: http.client.reqwest
    languages: [rust]
    severity: INFO
    message: outgoing HTTP client construction with reqwest
    metadata:
      archskillkit:
        fact: uses
        target_kind: http_client
        cardinality: many
        confidence: high
    pattern-either:
      - pattern: reqwest::Client::new()
      - pattern: reqwest::get(...)
