[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archskillkit"
version = "0.5.2"
description = "ArchSkillKit V2 domain core: event-sourced Architecture World on ActiveGraph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rubentxu" }]
keywords = [
    "architecture",
    "likec4",
    "code-analysis",
    "static-analysis",
    "agent",
    "evidence-driven",
    "ast-grep",
    "semgrep",
    "activegraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "activegraph>=1.10,<2",
    "jsonschema>=4.26.0",
    "lxml>=6.1.2",
]

[project.urls]
Homepage = "https://github.com/Rubentxu/arch-skillkit"
Repository = "https://github.com/Rubentxu/arch-skillkit"
Issues = "https://github.com/Rubentxu/arch-skillkit/issues"
Changelog = "https://github.com/Rubentxu/arch-skillkit/blob/main/CHANGELOG.md"
Releases = "https://github.com/Rubentxu/arch-skillkit/releases"

[project.optional-dependencies]
attestation = ["sigstore>=3.6", "cramjam>=2.8", "cryptography>=42"]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13",
       "hypothesis>=6", "cramjam>=2.8", "networkx>=3.6.1",
       "pyyaml>=6.0.1"]

[project.scripts]
archskillkit = "archskillkit.cli:main"

[project.entry-points."activegraph.packs"]
arch-core = "archskillkit.packs.arch_core:pack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# Progressive strictness (docs/v2/46 F2): the newest, tightest modules first.
files = [
  "src/archskillkit/runtime_manifest.py",
  "src/archskillkit/sensors.py",
  "src/archskillkit/sensor_candidate.py",
  "src/archskillkit/ids.py",
  "src/archskillkit/ports.py",
  "src/archskillkit/projections/metadata.py",
  "src/archskillkit/projections/drawio_delta.py",
]

[tool.coverage.run]
source = ["src/archskillkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
