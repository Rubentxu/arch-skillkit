[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archskillkit"
version = "0.2.0.dev0"
description = "ArchSkillKit V2 domain core: event-sourced Architecture World on ActiveGraph"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rubentxu" }]
dependencies = ["activegraph>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
archskillkit = "archskillkit.cli:main"

[project.entry-points."activegraph.packs"]
arch-core = "archskillkit.packs.arch_core:pack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
