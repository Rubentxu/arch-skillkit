name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint docs and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint Markdown
        run: npx -y markdownlint-cli2

      - name: Lint shell scripts
        run: |
          (cd skills/architecture-discovery/scripts && shellcheck -x workspace.sh doctor.sh run-manifest.sh lib/common.sh)
          shellcheck tests/test_helper.bash
          shellcheck --shell=bash tests/*.bats

      - name: Check MANIFEST.md sync
        run: bash scripts/check-manifest.sh

  bats:
    name: BATS suite (scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mise (pinned)
        run: |
          curl -fsSL https://mise.run | MISE_VERSION=v2026.8.6 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        run: |
          mise trust skills/architecture-discovery/runtime/mise.toml
          mise install -C skills/architecture-discovery/runtime

      - name: Install bats-core (pinned)
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core "$HOME/.bats-core"
          echo "$HOME/.bats-core/bin" >> "$GITHUB_PATH"

      - name: Run BATS suite
        run: bats tests/
