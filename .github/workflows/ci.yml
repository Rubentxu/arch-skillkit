name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint docs and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint Markdown
        run: npx -y markdownlint-cli2

      - name: Lint shell scripts
        run: |
          (cd skills/architecture-discovery/scripts && shellcheck -x workspace.sh doctor.sh run-manifest.sh lib/common.sh)
          shellcheck tests/test_helper.bash
          shellcheck --shell=bash tests/*.bats

      - name: Check MANIFEST.md sync
        run: bash scripts/check-manifest.sh

  python:
    name: pytest suite (V2 domain core)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable) with dev dependencies
        run: pip install -e 'python/[dev]'

      - name: Run pytest
        run: pytest python/tests -q

  bats:
    name: BATS suite (scripts + V2 seam)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install archskillkit (for the V2 seam tests)
        run: pip install -e python/

      - name: Install mise (pinned)
        run: |
          curl -fsSL https://mise.run | MISE_VERSION=v2026.8.6 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        run: |
          mise trust skills/architecture-discovery/runtime/mise.toml
          mise install -C skills/architecture-discovery/runtime

      - name: Install bats-core (pinned)
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core "$HOME/.bats-core"
          echo "$HOME/.bats-core/bin" >> "$GITHUB_PATH"

      - name: Run BATS suite
        run: bats tests/
