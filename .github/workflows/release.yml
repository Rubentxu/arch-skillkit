name: release

# Publishes a GitHub release when a v* tag is pushed. Validation must pass
# first; the tag must agree with the declared skill version and the pinned
# toolchain (supply chain, docs/05 and docs/15).
#
# docs/v2/24-distribution-and-installation.md: the release also carries the
# pinned runtime manifest, the LikeC4 npm bundles and the Semgrep
# wheelhouses that `archskillkit setup` installs, plus build provenance
# attestations for everything in dist/.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint Markdown
        run: npx -y markdownlint-cli2

      - name: Lint shell scripts
        run: |
          (cd skills/architecture-discovery/scripts && shellcheck -x *.sh lib/common.sh)
          shellcheck tests/test_helper.bash
          shellcheck --shell=bash ./tests/*.bats

      - name: Check MANIFEST.md sync
        run: bash scripts/check-manifest.sh

      - name: Install mise (pinned)
        run: |
          curl -fsSL https://mise.run | MISE_VERSION=v2026.8.6 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Bootstrap reproducible environment
        run: |
          mise run bootstrap
          mise run doctor

      - name: Run BATS suite (locked project interpreter)
        run: mise run test:bats

  runtime-assets:
    name: Runtime assets (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      LIKEC4_VERSION: "1.59.2"
      SEMGREP_VERSION: "1.175.0"
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Prepare dist
        run: mkdir -p dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build LikeC4 npm bundle
        run: |
          mkdir bundle && cd bundle
          npm init -y >/dev/null
          npm install --omit=dev "likec4@${LIKEC4_VERSION}"
          tar --dereference -czf "../dist/likec4-${LIKEC4_VERSION}-linux-${ARCH}.tar.gz" .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Semgrep wheelhouse
        run: |
          python -m pip download "semgrep==${SEMGREP_VERSION}" \
            --only-binary :all: --dest wheelhouse
          tar -czf "dist/semgrep-${SEMGREP_VERSION}-linux-${ARCH}.tar.gz" -C wheelhouse .

      - name: Upload runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: runtime-assets-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  runtime-manifest:
    name: Generate runtime manifest
    needs: runtime-assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download runtime assets
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-assets-*
          merge-multiple: true
          path: dist

      - name: Install manifest generator dependency
        run: python3 -m pip install --quiet pydantic

      - name: Generate pinned runtime manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release/generate-runtime-manifest.py \
            --version "$version" --commit "$GITHUB_SHA" \
            --assets-dir dist \
            --release-base "https://github.com/${{ github.repository }}/releases/download" \
            --out "dist/archskillkit-runtime-v${version}.manifest.json"

      - name: Sum runtime artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum ./*.tar.gz "archskillkit-runtime-v${version}.manifest.json" \
            > SHA256SUMS-runtime.txt

      - name: Upload manifest bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [validate, runtime-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches the declared skill version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(jq -r .skill_version skills/architecture-discovery/version.json)"
          if [ "$version" != "$declared" ]; then
            echo "ERROR: tag v$version does not match version.json skill_version $declared"
            exit 1
          fi

      - name: Verify toolchain matrix matches mise.toml
        run: |
          for tool in ast-grep semgrep likec4; do
            pinned="$(jq -r --arg t "$tool" '.toolchain[$t]' skills/architecture-discovery/version.json)"
            if ! grep -q "\"[^\"]*$tool[^\"]*\" = \"$pinned\"" skills/architecture-discovery/runtime/mise.toml; then
              echo "ERROR: $tool $pinned (version.json) not pinned in mise.toml"
              exit 1
            fi
          done

      - name: Build source release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/arch-skillkit-${version}.tar.gz" \
            README.md README.es.md LICENSE LICENSE.es.md CHANGELOG.md MANIFEST.md \
            .markdownlint-cli2.jsonc docs skills examples scripts tests
          sha256sum dist/arch-skillkit-"${version}".tar.gz > dist/SHA256SUMS.txt

      - name: Build Python wheel
        run: |
          python3 -m pip install --quiet build
          version="${GITHUB_REF_NAME#v}"
          declared="$(python3 -c "import json;print(json.load(open('skills/architecture-discovery/version.json'))['skill_version'])")"
          if [ "$version" != "$declared" ]; then
            echo "ERROR: runtime manifest version must match skill_version"
            exit 1
          fi
          python3 -m build --wheel --outdir dist python/

      - name: Download runtime assets and manifest
        uses: actions/download-artifact@v4
        with:
          name: runtime-manifest
          path: dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v ver="[$version]" 'index($0, "## " ver) {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md)"
          [ -n "$notes" ] || notes="Release v$version — see CHANGELOG.md."
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "arch-skillkit v$version" \
            --notes "$notes"
