name: distribution-smoke-test

# Distribution smoke test for archskillkit GitHub Releases.
#
# Triggers automatically after a successful `release` workflow run on a tag
# push, and can also be dispatched manually against any existing tag. The
# job downloads the freshly-published wheel and runtime manifest, then runs
# a clean-room install + setup + doctor to prove the release is end-to-end
# installable. Catches distribution regressions that no other check covers
# (broken wheel, mismatched manifest, runtime install failures, missing CLI
# subcommands).
#
# Why a separate workflow:
#   - `release` builds artifacts; this workflow consumes them. Splitting
#     keeps the release pipeline focused and lets us re-run smoke tests
#     against historic tags without rebuilding.
#   - `workflow_run` (this workflow) is the only way to react to the
#     completion of another workflow in the same repo without the
#     `workflow_dispatch` event being a primary trigger.
#
# References:
#   - docs/v2/24-distribution-and-installation.md (distribution model)
#   - docs/v2/STATUS.md (v0.5.0 distribution status)

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to smoke-test (e.g. v0.5.0). Must exist on origin with a published wheel + manifest."
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    name: Clean-room install + setup + doctor (${{ matrix.os }})
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            python: "3.12"
          - os: macos
            runner: macos-latest
            python: "3.12"
    env:
      # workflow_run uses workflow_run.head_branch (the tag, e.g. v0.5.0).
      # workflow_dispatch uses inputs.tag.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install --quiet uv

      - name: Create clean venv
        run: |
          uv venv /tmp/clean-venv
          echo "VIRTUAL_ENV=/tmp/clean-venv" >> "$GITHUB_ENV"

      - name: Download wheel and runtime manifest from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" \
            --pattern "archskillkit-${version}-py3-none-any.whl" \
            --pattern "archskillkit-runtime-${TAG}.manifest.json" \
            --dir /tmp/release-assets
          ls -la /tmp/release-assets

      - name: Verify wheel + manifest sha256 and metadata
        run: |
          version="${TAG#v}"
          VERSION="$version" python - <<'PY'
          import hashlib, json, os, pathlib, sys
          version = os.environ["VERSION"]
          base = pathlib.Path("/tmp/release-assets")
          wheel = base / f"archskillkit-{version}-py3-none-any.whl"
          manifest = base / f"archskillkit-runtime-v{version}.manifest.json"
          assert wheel.is_file(), f"missing wheel: {wheel}"
          assert manifest.is_file(), f"missing manifest: {manifest}"
          w = hashlib.sha256(wheel.read_bytes()).hexdigest()
          m = hashlib.sha256(manifest.read_bytes()).hexdigest()
          print(f"wheel sha256:    {w}")
          print(f"manifest sha256: {m}")
          data = json.loads(manifest.read_text())
          assert data["schema_version"] == 1, f"unexpected schema_version: {data.get('schema_version')}"
          assert data["release"]["version"] == version, data["release"]
          assert data["release"]["git_tag"] == "v" + version, data["release"]
          n_artifacts = sum(len(p.get("artifacts", [])) for p in data.get("platforms", []))
          print(f"manifest OK: version={data['release']['version']} commit={data['release']['commit'][:12]} artifacts={n_artifacts}")
          PY

      - name: Install wheel from local path
        run: |
          version="${TAG#v}"
          uv pip install --quiet "/tmp/release-assets/archskillkit-${version}-py3-none-any.whl"
          python -c "import archskillkit; assert archskillkit.__version__ == '$version', archskillkit.__version__"
          python -m archskillkit --version

      - name: archskillkit setup
        run: |
          python -m archskillkit setup 2>&1 | tail -10
          # setup must create the XDG data dir; otherwise the install failed silently.
          if [ ! -d "${XDG_DATA_HOME:-$HOME/.local/share}/archskillkit" ]; then
            echo "::warning::setup did not create expected XDG data dir (${XDG_DATA_HOME:-$HOME/.local/share}/archskillkit)"
          fi

      - name: archskillkit doctor
        run: |
          version="${TAG#v}"
          python -m archskillkit doctor > /tmp/doctor.json
          cat /tmp/doctor.json
          VERSION="$version" python - <<'PY'
          import json, os, sys
          d = json.load(open("/tmp/doctor.json"))
          assert d["status"] == "ready", f"doctor status: {d['status']}"
          expected_tag = "v" + os.environ["VERSION"]
          assert d["release"]["git_tag"] == expected_tag, d["release"]
          checks = d.get("checks", [])
          n_fail = sum(1 for c in checks if c.get("status") == "fail")
          assert n_fail == 0, f"{n_fail} doctor checks failed: {[c for c in checks if c.get('status')=='fail']}"
          print(f"doctor OK: {len(checks)} checks, {n_fail} failures")
          PY

      - name: archskillkit CLI smoke (subcommands discoverable)
        run: |
          python -m archskillkit --help > /tmp/help.txt
          grep -q "setup" /tmp/help.txt
          grep -q "doctor" /tmp/help.txt
          grep -q "discover" /tmp/help.txt
          echo "CLI subcommands present"

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report-${{ matrix.os }}
          path: |
            /tmp/release-assets/
            /tmp/doctor.json
            /tmp/help.txt
          if-no-files-found: ignore
